<svg xmlns="http://www.w3.org/2000/svg" width="800" height="528" viewBox="0 0 800 528">
<title>Arabesque cheat sheet</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#1f2328}.h{font-size:26px;font-weight:600}.c{font-size:30px;text-anchor:middle}.t{font-size:18px;text-anchor:middle}.n{font-size:15px}.b{font-weight:600}.k{fill:#f6f8fa;stroke:#afb8c1}.o{fill:#eaeef2}</style>
<rect x="0.5" y="0.5" width="799" height="527" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text class="h" x="40" y="58">Hold ⌥, type the keys, let go</text>
<text class="c" x="57" y="123">é</text><rect class="k o" x="86" y="96" width="32" height="32" rx="6"/><text class="t" x="102" y="118">⌥</text><rect class="k" x="123" y="96" width="32" height="32" rx="6"/><text class="t" x="139" y="118">e</text>
<text class="c" x="241" y="123">è</text><rect class="k o" x="270" y="96" width="32" height="32" rx="6"/><text class="t" x="286" y="118">⌥</text><rect class="k" x="307" y="96" width="32" height="32" rx="6"/><text class="t" x="323" y="118">e</text><rect class="k" x="344" y="96" width="32" height="32" rx="6"/><text class="t" x="360" y="118">e</text>
<text class="c" x="425" y="123">ê</text><rect class="k o" x="454" y="96" width="32" height="32" rx="6"/><text class="t" x="470" y="118">⌥</text><rect class="k" x="491" y="96" width="32" height="32" rx="6"/><text class="t" x="507" y="118">e</text><rect class="k" x="528" y="96" width="32" height="32" rx="6"/><text class="t" x="544" y="118">s</text>
<text class="c" x="609" y="123">ë</text><rect class="k o" x="638" y="96" width="32" height="32" rx="6"/><text class="t" x="654" y="118">⌥</text><rect class="k" x="675" y="96" width="32" height="32" rx="6"/><text class="t" x="691" y="118">e</text><rect class="k" x="712" y="96" width="32" height="32" rx="6"/><text class="t" x="728" y="118">;</text>
<text class="c" x="57" y="175">ä</text><rect class="k o" x="86" y="148" width="32" height="32" rx="6"/><text class="t" x="102" y="170">⌥</text><rect class="k" x="123" y="148" width="32" height="32" rx="6"/><text class="t" x="139" y="170">a</text>
<text class="c" x="241" y="175">à</text><rect class="k o" x="270" y="148" width="32" height="32" rx="6"/><text class="t" x="286" y="170">⌥</text><rect class="k" x="307" y="148" width="32" height="32" rx="6"/><text class="t" x="323" y="170">a</text><rect class="k" x="344" y="148" width="32" height="32" rx="6"/><text class="t" x="360" y="170">a</text>
<text class="c" x="425" y="175">â</text><rect class="k o" x="454" y="148" width="32" height="32" rx="6"/><text class="t" x="470" y="170">⌥</text><rect class="k" x="491" y="148" width="32" height="32" rx="6"/><text class="t" x="507" y="170">a</text><rect class="k" x="528" y="148" width="32" height="32" rx="6"/><text class="t" x="544" y="170">s</text>
<text class="c" x="609" y="175">æ</text><rect class="k o" x="638" y="148" width="32" height="32" rx="6"/><text class="t" x="654" y="170">⌥</text><rect class="k" x="675" y="148" width="32" height="32" rx="6"/><text class="t" x="691" y="170">a</text><rect class="k" x="712" y="148" width="32" height="32" rx="6"/><text class="t" x="728" y="170">e</text>
<text class="c" x="57" y="227">ö</text><rect class="k o" x="86" y="200" width="32" height="32" rx="6"/><text class="t" x="102" y="222">⌥</text><rect class="k" x="123" y="200" width="32" height="32" rx="6"/><text class="t" x="139" y="222">o</text>
<text class="c" x="241" y="227">ô</text><rect class="k o" x="270" y="200" width="32" height="32" rx="6"/><text class="t" x="286" y="222">⌥</text><rect class="k" x="307" y="200" width="32" height="32" rx="6"/><text class="t" x="323" y="222">o</text><rect class="k" x="344" y="200" width="32" height="32" rx="6"/><text class="t" x="360" y="222">s</text>
<text class="c" x="425" y="227">œ</text><rect class="k o" x="454" y="200" width="32" height="32" rx="6"/><text class="t" x="470" y="222">⌥</text><rect class="k" x="491" y="200" width="32" height="32" rx="6"/><text class="t" x="507" y="222">o</text><rect class="k" x="528" y="200" width="32" height="32" rx="6"/><text class="t" x="544" y="222">e</text>
<text class="c" x="57" y="279">ü</text><rect class="k o" x="86" y="252" width="32" height="32" rx="6"/><text class="t" x="102" y="274">⌥</text><rect class="k" x="123" y="252" width="32" height="32" rx="6"/><text class="t" x="139" y="274">u</text>
<text class="c" x="241" y="279">ù</text><rect class="k o" x="270" y="252" width="32" height="32" rx="6"/><text class="t" x="286" y="274">⌥</text><rect class="k" x="307" y="252" width="32" height="32" rx="6"/><text class="t" x="323" y="274">u</text><rect class="k" x="344" y="252" width="32" height="32" rx="6"/><text class="t" x="360" y="274">u</text>
<text class="c" x="425" y="279">û</text><rect class="k o" x="454" y="252" width="32" height="32" rx="6"/><text class="t" x="470" y="274">⌥</text><rect class="k" x="491" y="252" width="32" height="32" rx="6"/><text class="t" x="507" y="274">u</text><rect class="k" x="528" y="252" width="32" height="32" rx="6"/><text class="t" x="544" y="274">s</text>
<text class="c" x="57" y="331">î</text><rect class="k o" x="86" y="304" width="32" height="32" rx="6"/><text class="t" x="102" y="326">⌥</text><rect class="k" x="123" y="304" width="32" height="32" rx="6"/><text class="t" x="139" y="326">i</text><rect class="k" x="160" y="304" width="32" height="32" rx="6"/><text class="t" x="176" y="326">s</text>
<text class="c" x="241" y="331">ï</text><rect class="k o" x="270" y="304" width="32" height="32" rx="6"/><text class="t" x="286" y="326">⌥</text><rect class="k" x="307" y="304" width="32" height="32" rx="6"/><text class="t" x="323" y="326">i</text><rect class="k" x="344" y="304" width="32" height="32" rx="6"/><text class="t" x="360" y="326">;</text>
<text class="c" x="57" y="383">ç</text><rect class="k o" x="86" y="356" width="32" height="32" rx="6"/><text class="t" x="102" y="378">⌥</text><rect class="k" x="123" y="356" width="32" height="32" rx="6"/><text class="t" x="139" y="378">c</text>
<text class="c" x="241" y="383">ß</text><rect class="k o" x="270" y="356" width="32" height="32" rx="6"/><text class="t" x="286" y="378">⌥</text><rect class="k" x="307" y="356" width="32" height="32" rx="6"/><text class="t" x="323" y="378">s</text>
<text class="c" x="425" y="383">ÿ</text><rect class="k o" x="454" y="356" width="32" height="32" rx="6"/><text class="t" x="470" y="378">⌥</text><rect class="k" x="491" y="356" width="32" height="32" rx="6"/><text class="t" x="507" y="378">y</text><rect class="k" x="528" y="356" width="32" height="32" rx="6"/><text class="t" x="544" y="378">;</text>
<path d="M40 412H760" stroke="#d0d7de"/>
<text class="n" x="40" y="446"><tspan class="b">s</tspan> = circumflex · double a, e or u = grave · <tspan class="b">e</tspan> after a or o = ligature</text>
<text class="n" x="40" y="472"><tspan class="b">;</tspan> after e, i, u or y = tréma (also <tspan class="b">⌥ ;</tspan> first, then the letter)</text>
<text class="n" x="40" y="498"><tspan class="b">Capitals:</tspan> Shift with the letter, or tap Shift before or after it while ⌥ is held</text>
</svg>
